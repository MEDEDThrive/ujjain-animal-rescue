<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ujjain Animal Rescue - Bejuban ki Pukar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#9b1c31',
                        secondary: '#1d4ed8',
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .splash-screen {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #9b1c31, #4a0e18);
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">

    <!-- Splash -->
    <div id="splashScreen" class="splash-screen">
        <div class="text-center p-6">
            <div class="w-24 h-24 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                <i class="fa-solid fa-shield-dog text-5xl text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-wider mb-2">UJJAIN ANIMAL RESCUE</h1>
            <p class="text-lg text-red-200 italic font-medium">"Bejuban ki Pukar"</p>
        </div>
    </div>

    <div class="max-w-md mx-auto min-h-screen bg-white dark:bg-gray-800 shadow-xl flex flex-col relative pb-16">

        <!-- Header -->
        <header class="bg-primary text-white p-6 rounded-b-3xl shadow-lg relative overflow-hidden">
            <div class="absolute top-4 right-4 flex items-center gap-2">
                <button onclick="toggleDarkMode()" class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition">
                    <i id="darkModeIcon" class="fa-solid fa-moon text-white"></i>
                </button>
            </div>
            <div class="flex flex-col items-center text-center">
                <div onclick="handleFounderClick()" class="w-24 h-24 rounded-full border-4 border-white/30 overflow-hidden shadow-md mb-3 cursor-pointer relative group">
                    <img src="Screenshot_2026-07-19-19-13-38-60_1c337646f29875672b5a61192b9010f9.jpg" 
                         onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=300';"
                         alt="Founder Raj Malviya" class="w-full h-full object-cover">
                </div>
                <h2 class="text-xl font-bold tracking-wide">Raj Malviya</h2>
                <p class="text-xs text-red-100 font-medium tracking-wider uppercase mt-0.5">Founder, Ujjain Animal Rescue</p>
            </div>
        </header>

        <main class="flex-1 p-4 space-y-4">

            <!-- HOME -->
            <div id="homeView" class="space-y-4">
                <div id="statusBar" class="hidden text-center text-[11px] py-1.5 rounded-lg font-medium"></div>

                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-red-50 dark:bg-gray-700 p-3 rounded-xl border border-red-100 dark:border-gray-600">
                        <span id="totalCount" class="block text-xl font-black text-primary dark:text-red-400">0</span>
                        <span class="text-[10px] uppercase font-bold text-gray-500 dark:text-gray-300">Total Calls</span>
                    </div>
                    <div class="bg-yellow-50 dark:bg-gray-700 p-3 rounded-xl border border-yellow-100 dark:border-gray-600">
                        <span id="pendingCount" class="block text-xl font-black text-yellow-600 dark:text-yellow-400">0</span>
                        <span class="text-[10px] uppercase font-bold text-gray-500 dark:text-gray-300">Pending</span>
                    </div>
                    <div class="bg-green-50 dark:bg-gray-700 p-3 rounded-xl border border-green-100 dark:border-gray-600">
                        <span id="completedCount" class="block text-xl font-black text-green-600 dark:text-green-400">0</span>
                        <span class="text-[10px] uppercase font-bold text-gray-500 dark:text-gray-300">Rescued</span>
                    </div>
                </div>

                <div class="space-y-3 pt-2">
                    <button onclick="switchView('requestView')" class="w-full bg-gradient-to-r from-red-600 to-primary text-white p-4 rounded-2xl shadow-md flex items-center justify-between hover:opacity-95 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center"><i class="fa-solid fa-bullhorn text-lg"></i></div>
                            <div class="text-left">
                                <h3 class="font-bold text-sm">New Rescue Request</h3>
                                <p class="text-[11px] text-red-100">Report an injured animal instantly</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-sm"></i>
                    </button>

                    <button onclick="switchView('liveView')" class="w-full bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 p-4 rounded-2xl shadow-sm flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-600 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-red-100 dark:bg-gray-600 text-primary dark:text-red-400 rounded-xl flex items-center justify-center">
                                <i class="fa-solid fa-tower-broadcast text-lg animate-pulse"></i>
                            </div>
                            <div class="text-left">
                                <h3 class="font-bold text-sm">Live Requests & Timeline</h3>
                                <p class="text-[11px] text-gray-500 dark:text-gray-400">Track cases & status updates</p>
                            </div>
                        </div>
                        <span id="liveBadge" class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                    </button>

                    <button onclick="switchView('trackingView'); initTrackingMap();" class="w-full bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 p-4 rounded-2xl shadow-sm flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-600 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-indigo-100 dark:bg-gray-600 text-indigo-600 dark:text-indigo-400 rounded-xl flex items-center justify-center">
                                <i class="fa-solid fa-map-location-dot text-lg"></i>
                            </div>
                            <div class="text-left">
                                <h3 class="font-bold text-sm">Live Team Tracking & Heatmap</h3>
                                <p class="text-[11px] text-gray-500 dark:text-gray-400">GPS sevaks & case density map</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-sm text-gray-400"></i>
                    </button>

                    <button onclick="switchView('donationView')" class="w-full bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 p-4 rounded-2xl shadow-sm flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-600 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-amber-100 dark:bg-gray-600 text-amber-600 dark:text-amber-400 rounded-xl flex items-center justify-center">
                                <i class="fa-solid fa-hand-holding-heart text-lg"></i>
                            </div>
                            <div class="text-left">
